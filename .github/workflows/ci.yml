name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
      - run: npm ci
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
      - run: npm ci
      - run: npm run build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
      - run: npm ci
      - run: npm run check
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
      - name: Configure git
        run: |
          git config --global user.name "Bikram Biswas"
          git config --global user.email "106413198+BikramBiswas786@users.noreply.github.com"
      - name: Scaffold this repo and re-run the gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/github-manifest-auth.cjs
        run: |
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/bandpay-ci"
            if npx --yes create-scaffold-hbar@latest bandpay-ci --template BikramBiswas786/bandpay --yes --ci --skip-hedera-skills --package-manager npm --network testnet --destination "$RUNNER_TEMP/bandpay-ci"; then
              ok=1
              break
            fi
            echo "scaffold attempt ${attempt} failed, retrying"
            sleep $((attempt * 20))
          done
          test "$ok" = 1
          test -d "$RUNNER_TEMP/bandpay-ci/packages/hardhat"
          test ! -d "$RUNNER_TEMP/bandpay-ci/packages/foundry"
          cd "$RUNNER_TEMP/bandpay-ci"
          npm run lint
          npm test
          npm run build
